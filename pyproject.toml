[project]
name = "xpectral-chart"
version = "2.0.0"
description = "Fluent Bokeh charting for Polars and Pandas DataFrames"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "BayQuant" }
]
keywords = ["bokeh", "charting", "visualization", "polars", "pandas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "bokeh==3.8.1",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "pyarrow>=21.0.0",
]

[project.urls]
Homepage = "https://github.com/bayquant/xpectral-chart"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.6",                      # code formatter and linter
    "pre-commit>=4.4.0",              # git hook manager
    "pytest>=8.0.0",                  # test runner
    "ipykernel>=7.0.1",               # jupyter notebook support
    "furo>=2024.0",                   # sphinx theme for docs
    "myst-parser>=3.0",               # markdown support in sphinx docs
    "sphinx>=8.0",                    # sphinx documentation generator
    "sphinx-autodoc-typehints>=2.0",  # type hint rendering in sphinx docs
]

# A regular package with a unique import name (`xpectral_chart`), so it cannot
# collide with sibling projects installed in the same environment.
[tool.hatch.build.targets.wheel]
packages = ["xpectral_chart"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long: handled by formatter, not linter
]

[tool.ruff.lint.isort]
known-first-party = ["xpectral_chart"]
